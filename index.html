<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Sintaxiando Ando</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Guía de estudio de Sintaxis y Semántica de los Lenguajes (UTN FRT 2026): teoría, gráficos de autómatas, defensas de TP, cartas de laboratorio con tiempo y simulacros de parcial.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: cinta de Turing como barra de navegación; columna de lectura de ~70ch con índice lateral en escritorio. */
:root {
  --paper: #f3f5f2;
  --surface: #ffffff;
  --sunk: #e9ede8;
  --ink: #17202b;
  --muted: #586372;
  --line: #d3d9d3;
  --grid: rgba(35, 70, 200, 0.055);
  --accent: #2346c8;
  --accent-ink: #ffffff;
  --accent-soft: #e2e8fb;
  --mark: #e3a300;
  --mark-soft: #fbefcc;
  --ok: #1d8049;
  --ok-soft: #dcf1e4;
  --bad: #bf342c;
  --bad-soft: #f8e0dd;
  --f-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
  --step--1: 0.86rem;
  --step-0: 1rem;
  --step-1: 1.2rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --step-4: 2.8rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141b;
    --surface: #161d26;
    --sunk: #1c2530;
    --ink: #e5e9ef;
    --muted: #9aa5b4;
    --line: #2b3542;
    --grid: rgba(143, 167, 255, 0.05);
    --accent: #8ea6ff;
    --accent-ink: #0f141b;
    --accent-soft: #1d2846;
    --mark: #f2b33d;
    --mark-soft: #3a2f14;
    --ok: #55c486;
    --ok-soft: #15301f;
    --bad: #ff7d72;
    --bad-soft: #3a1b19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141b;
  --surface: #161d26;
  --sunk: #1c2530;
  --ink: #e5e9ef;
  --muted: #9aa5b4;
  --line: #2b3542;
  --grid: rgba(143, 167, 255, 0.05);
  --accent: #8ea6ff;
  --accent-ink: #0f141b;
  --accent-soft: #1d2846;
  --mark: #f2b33d;
  --mark-soft: #3a2f14;
  --ok: #55c486;
  --ok-soft: #15301f;
  --bad: #ff7d72;
  --bad-soft: #3a1b19;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.6;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
a { color: var(--accent); text-underline-offset: 2px; }
code, .mono { font-family: var(--f-mono); font-size: 0.92em; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-4); letter-spacing: -0.02em; }
h2 { font-size: var(--step-3); letter-spacing: -0.01em; }
h3 { font-size: var(--step-1); }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
sub, sup { line-height: 0; }

/* ---------- cabecera tipo cinta ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.top-in {
  display: flex; align-items: center; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  max-width: 1240px; margin: 0 auto;
}
.brand {
  font-family: var(--f-display); font-weight: 700; font-size: 1.05rem;
  text-decoration: none; color: var(--ink); white-space: nowrap;
  display: flex; align-items: center; gap: 8px;
}
.brand .q { font-family: var(--f-mono); font-size: 0.75rem; border: 1.5px solid var(--accent); color: var(--accent);
  border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; font-weight: 600; }
.tape {
  flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: thin;
  display: flex; align-items: stretch;
}
.tape-cells { display: flex; border: 1.5px solid var(--ink); border-radius: 3px; margin: 10px 0 12px; }
.tape a {
  position: relative; display: block; padding: 6px 12px; white-space: nowrap;
  font-family: var(--f-mono); font-size: 0.8rem; text-decoration: none; color: var(--ink);
  border-right: 1.5px solid var(--ink);
}
.tape a:last-child { border-right: 0; }
.tape a:hover { background: var(--sunk); }
.tape a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.tape a[aria-current="page"]::after {
  content: ""; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: var(--accent);
}
.tools { display: flex; align-items: center; gap: 10px; }
.progress-pill {
  font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); white-space: nowrap;
  border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px;
}
.search { position: relative; }
.search input {
  width: 170px; font: inherit; font-size: 0.88rem; padding: 6px 10px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
}
.search-res {
  position: absolute; right: 0; top: calc(100% + 6px); width: min(380px, 86vw); max-height: 60vh; overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: 0 10px 30px rgba(0,0,0,0.12); padding: 6px; z-index: 20;
}
.search-res a { display: block; padding: 8px 10px; border-radius: 4px; text-decoration: none; color: var(--ink); font-size: 0.9rem; }
.search-res a:hover, .search-res a:focus { background: var(--accent-soft); }
.search-res small { color: var(--muted); display: block; font-size: 0.75rem; }
@media (max-width: 760px) {
  .top-in { flex-wrap: wrap; row-gap: 0; }
  .tape { order: 3; flex-basis: 100%; }
  .tools { margin-left: auto; }
  .search input { width: 130px; }
}

/* ---------- estructura ---------- */
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 80px;
}
.page { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 44px; align-items: start; }
.page.solo { grid-template-columns: minmax(0, 1fr); max-width: 940px; margin: 0 auto; }
@media (max-width: 960px) { .page { grid-template-columns: minmax(0, 1fr); } .toc { display: none; } }
.toc { position: sticky; top: 90px; font-size: 0.88rem; max-height: calc(100vh - 110px); overflow: auto; }
.toc h4 { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.toc a { display: block; color: var(--muted); text-decoration: none; padding: 4px 0 4px 12px; border-left: 2px solid var(--line); }
.toc a:hover { color: var(--ink); }
.toc a.done::after { content: " ✓"; color: var(--ok); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 40px; }
.kicker { font-family: var(--f-mono); font-size: 0.8rem; letter-spacing: 0.02em; color: var(--accent); }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 62ch; }
.head { display: flex; flex-direction: column; gap: 12px; }

section.sec { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 90px; }
@media (max-width: 760px) { section.sec, .ex { scroll-margin-top: 150px; } }
.t.tight td, .t.tight th { padding: 3px 8px; }
.hero .demo > [data-sim] .sim { border: 0; padding: 0; }
section.sec > h2 { font-size: var(--step-2); padding-top: 8px; border-top: 1.5px solid var(--ink); }
section.sec > h2 .n { font-family: var(--f-mono); font-size: 0.9rem; color: var(--muted); margin-right: 8px; font-weight: 500; }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 72ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.prose li::marker { color: var(--muted); }

/* definición textual: el formato que se toma en los V/F */
.def {
  max-width: 72ch; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
}
.def .term { font-family: var(--f-display); font-weight: 700; font-size: 1.02rem; }
.def .tag { font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.def p { font-size: 0.98rem; }
.formula {
  font-family: var(--f-mono); font-size: 0.92rem; background: var(--sunk); border-radius: 4px;
  padding: 10px 12px; overflow-x: auto; white-space: pre; max-width: 100%;
}
.note { max-width: 72ch; border-left: 3px solid var(--mark); background: var(--mark-soft); padding: 10px 14px; border-radius: 0 var(--r) var(--r) 0; font-size: 0.95rem; }
.note b { font-family: var(--f-display); }
.ex { max-width: 72ch; border: 1px dashed var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ex > .t { font-family: var(--f-display); font-weight: 600; font-size: 0.95rem; color: var(--muted); }

.tbl-wrap { overflow-x: auto; max-width: 100%; }
table.t { border-collapse: collapse; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
table.t th, table.t td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
table.t th { background: var(--sunk); font-family: var(--f-display); font-weight: 600; }
table.t.mono td, table.t.mono th { font-family: var(--f-mono); text-align: center; }
table.t td.hl { background: var(--mark-soft); outline: 2px solid var(--mark); outline-offset: -2px; }

/* figuras */
figure.fig { margin: 0; display: flex; flex-direction: column; gap: 8px; max-width: 100%; }
figure.fig .canvas { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
figure.fig svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
figure.fig figcaption { font-size: 0.85rem; color: var(--muted); }
.fa-state { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.fa-state.cur { fill: var(--mark); }
.fa-state.cur2 { fill: var(--mark-soft); }
.fa-fin { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.fa-lbl { fill: var(--ink); font-family: var(--f-mono); font-size: 13px; text-anchor: middle; dominant-baseline: central; }
.fa-sub { fill: var(--muted); font-family: var(--f-mono); font-size: 10px; text-anchor: middle; dominant-baseline: central; }
.fa-edge { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.fa-edge.on { stroke: var(--accent); stroke-width: 2.6; }
.fa-head { fill: var(--ink); }
.fa-elbl { fill: var(--ink); font-family: var(--f-mono); font-size: 11.5px; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.fa-elbl.on { fill: var(--accent); font-weight: 700; }
.tr-line { stroke: var(--muted); stroke-width: 1.2; }
.tr-nt { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.tr-t { fill: var(--surface); stroke: var(--ink); stroke-width: 1.2; }
.rr-path { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.rr-nt { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.rr-t { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4; }
.rr-txt { fill: var(--ink); font-family: var(--f-mono); font-size: 12.5px; text-anchor: middle; dominant-baseline: central; }

/* cinta y pila (html) */
.tapebox { display: flex; flex-direction: column; gap: 6px; }
.tapebox .lab { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.cells { display: flex; overflow-x: auto; padding: 14px 2px 4px; }
.cell {
  position: relative; min-width: 34px; height: 38px; display: grid; place-items: center;
  border: 1.5px solid var(--ink); margin-left: -1.5px; background: var(--surface);
  font-family: var(--f-mono); font-size: 1rem;
}
.cell.dim { color: var(--muted); }
.cell.read { background: var(--sunk); color: var(--muted); }
.cell.head { background: var(--mark-soft); }
.cell.head::before {
  content: attr(data-q); position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
  font-size: 0.68rem; color: var(--ink); background: var(--mark); padding: 0 5px; border-radius: 3px; white-space: nowrap;
}
.stack { display: flex; flex-direction: column-reverse; align-items: center; gap: 0; min-width: 56px; }
.stack .cell { margin-left: 0; margin-top: -1.5px; width: 48px; }
.stack .cell.top { background: var(--mark-soft); }

/* ---------- inicio ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 8px 12px; }
@media (max-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero h1 { font-size: clamp(2.4rem, 7vw, 4.4rem); line-height: 0.98; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .demo { background: var(--surface); border: 1.5px solid var(--ink); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hero .demo .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 820px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.block.strong { border: 1.5px solid var(--ink); }
.block h3 { display: flex; align-items: baseline; gap: 10px; }
.block h3 .n { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.idx { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.idx li { border-top: 1px solid var(--line); }
.idx a { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; text-decoration: none; color: var(--ink); }
.idx a:hover { color: var(--accent); }
.idx .meta { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: 0.72rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.acc { border-color: var(--accent); color: var(--accent); }
.chip.ok { border-color: var(--ok); color: var(--ok); }

/* ---------- botones / formularios ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none;
  border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink);
  padding: 7px 14px; border-radius: var(--r); font-size: 0.92rem; font-weight: 600; line-height: 1.2;
}
.btn:hover { background: var(--sunk); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { border-color: var(--line); font-weight: 500; }
.btn.ok { border-color: var(--ok); color: var(--ok); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input.txt, select.sel, textarea.txt {
  font: inherit; font-size: 0.95rem; padding: 7px 10px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--paper); color: var(--ink); max-width: 100%;
}
input.txt.mono, textarea.txt.mono { font-family: var(--f-mono); }
textarea.txt { width: 100%; min-height: 70px; }
label.inline { display: inline-flex; gap: 6px; align-items: center; font-size: 0.92rem; }

/* ---------- cuestionarios ---------- */
.quiz { display: flex; flex-direction: column; gap: 14px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.qcard.right { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
.qcard.wrong { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
.qcard .qh { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.qcard .qt { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.qcard .pts { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
.qcard .q { font-size: 1rem; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; background: var(--paper); }
.opt:hover { border-color: var(--muted); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt.is-right { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.vf { display: flex; gap: 8px; }
.vf .btn { min-width: 64px; justify-content: center; }
.vf .btn.sel { background: var(--ink); color: var(--paper); }
.vf .btn.is-right { border-color: var(--ok); background: var(--ok); color: #fff; }
.vf .btn.is-wrong { border-color: var(--bad); background: var(--bad); color: #fff; }
.match { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; }
.match .l { font-size: 0.95rem; }
.match .l code { white-space: pre-wrap; }
.match select.is-right { border-color: var(--ok); background: var(--ok-soft); }
.match select.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
@media (max-width: 560px) { .match { grid-template-columns: minmax(0, 1fr); } }
.fill { display: flex; flex-direction: column; gap: 8px; }
.fill .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fill .row .k { font-size: 0.94rem; }
.fill input.is-right { border-color: var(--ok); background: var(--ok-soft); }
.fill input.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.why { font-size: 0.93rem; background: var(--sunk); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.why b { font-family: var(--f-display); }
.score { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1.5px solid var(--ink); border-radius: var(--r); padding: 14px 16px; }
.score .big { font-family: var(--f-display); font-size: var(--step-3); font-weight: 700; font-variant-numeric: tabular-nums; }
.selfeval { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; color: var(--muted); }

/* ---------- cartas de laboratorio ---------- */
.deckpick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 820px) { .deckpick { grid-template-columns: minmax(0, 1fr); } }
.arena { display: flex; flex-direction: column; gap: 16px; align-items: center; }
.card {
  width: min(560px, 100%); min-height: 300px; border-radius: 14px; border: 1.5px solid var(--ink);
  background: var(--surface); padding: 22px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 6px 6px 0 var(--accent-soft);
}
.card .ctop { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.card .cq { font-family: var(--f-display); font-size: 1.35rem; line-height: 1.3; font-weight: 600; text-wrap: balance; }
.card .ca { border-top: 1px dashed var(--line); padding-top: 12px; font-size: 0.98rem; display: flex; flex-direction: column; gap: 8px; }

  function runDeck(lab, n, secs) {
    var deck = pick(lab.cards, Math.min(n, lab.cards.length)), i = 0, res = [];
    var ar = $("#arena");
    ar.scrollIntoView({ behavior: "smooth", block: "start" });
    function show() {
      clearInterval(tick);
      if (i >= deck.length) return end();
      var c = deck[i], left = secs, done = false;
      var ord = shuffle(c.o.map(function (_, k) { return k; }));
      ar.innerHTML = '<div class="arena"><div class="timer" id="tm"><div class="lbl"><span>Carta ' + (i + 1) + " de " + deck.length + '</span><span id="tl">' + fmt(left) + '</span></div><div class="bar"><div class="fill" id="tf"></div></div></div>' +

        '<div class="ca hide" id="ans"></div></div><div class="btns" id="cb"></div></div>';
      var tf = $("#tf"), tl = $("#tl"), tm = $("#tm");
      function answer(k, timeout) {
        if (done) return; done = true; clearInterval(tick);
        var ok = k === 0;
        $$("#co .copt").forEach(function (b) { b.disabled = true; var bk = +b.dataset.k; if (bk === 0) b.classList.add("is-right"); else if (bk === k) b.classList.add("is-wrong"); });
        if (timeout) { tm.classList.add("out"); tl.textContent = "Tiempo"; }
        var ans = $("#ans"); ans.classList.remove("hide");
        ans.innerHTML = "<div><b>" + (timeout ? "Se terminó el tiempo." : ok ? "Correcta." : "Incorrecta.") + "</b></div>" + (c.why ? "<p>" + c.why + "</p>" : "");
        res.push({ c: c, r: ok ? 1 : 0, pick: k });
        $("#cb").innerHTML = '<button type="button" class="btn pri" id="nx">' + (i + 1 < deck.length ? "Siguiente carta" : "Ver resultado") + "</button>";
        $("#nx").addEventListener("click", function () { i++; show(); });
        $("#nx").focus();
      }
      $$("#co .copt").forEach(function (b) { b.addEventListener("click", function () { answer(+b.dataset.k, false); }); });
      tick = setInterval(function () {
        left -= 0.25;
        tf.style.width = Math.max(0, 100 * left / secs) + "%";
        tl.textContent = fmt(Math.ceil(left));
        if (left <= secs * 0.3) tm.classList.add("warn");
        if (left <= 0) answer(-1, true);
      }, 250);
    }
    function end() {
      clearInterval(tick);
      var s = 0; res.forEach(function (r) { s += r.r; });
      var pct = Math.round(100 * s / res.length);
      var best = store.get("best", {}); best[lab.id] = Math.max(best[lab.id] || 0, pct); store.set("best", best);
      ar.innerHTML = '<div class="score"><span class="big">' + s + " / " + res.length + "</span><span>" + pct + "% · " + (pct >= 60 ? "Ronda aprobada." : "Repasá las cartas que fallaste y volvé a intentar.") + '</span></div><div class="quiz" style="margin-top:14px">' +
        res.filter(function (r) { return r.r < 1; }).map(function (r) { return '<div class="qcard wrong"><div class="qt">' + esc(r.c.tag || "") + '</div><div class="q"><b>' + r.c.q + '</b></div><div class="why">' + (r.pick >= 0 ? "<p>Elegiste: " + r.c.o[r.pick] + "</p>" : "<p>Sin responder (se terminó el tiempo).</p>") + "<p><b>Correcta:</b> " + r.c.o[0] + "</p>" + (r.c.why ? "<p>" + r.c.why + "</p>" : "") + "</div></div>"; }).join("") +
        '</div><div class="btns" style="margin-top:14px"><button type="button" class="btn pri" id="again">Otra ronda</button></div>';
      $("#again").addEventListener("click", function () { runDeck(lab, n, secs); });
    }
    show();
  }

      var words = v.split(" ");
      var r = idx.map(function (it) { var sc = 0; words.forEach(function (w) { if (norm(it.t).indexOf(w) >= 0) sc += 3; else if (it.b.indexOf(w) >= 0) sc += 1; else sc -= 5; }); return { it: it, sc: sc }; }).filter(function (x) { return x.sc > 0; }).sort(function (a, b) { return b.sc - a.sc; }).slice(0, 10);
      box.innerHTML = r.length ? r.map(function (x) { return '<a href="#' + x.it.h + '"><small>' + esc(x.it.u) + "</small>" + esc(x.it.t) + "</a>"; }).join("") : '<p class="empty" style="padding:8px">Sin resultados.</p>';
      box.classList.remove("hide");

    tp: { n: 1, title: "Lingüística matemática", clase: [
      { id: "1.2", txt: "<p>Σ = {0, 1, a, b}, L1 = {a, b}, L2 = {λ, 0, 1}. Resolver e indicar cardinalidad.</p>", sol: [{ table: { mono: true, h: ["Op.", "Resultado", "Card."], r: [["L2.L1", "{a, b, 0a, 0b, 1a, 1b}", "6"], ["L2²", "{λ, 0, 1, 00, 01, 10, 11}", "7"], ["L1⁺", "secuencias de a y b de long ≥ 1", "∞"], ["L2⁺", "secuencias de 0 y 1 incluida λ (= L2*)", "∞"], ["(L1 ∪ L2)¹⁰", "secuencias de a, b, 0, 1 de long ≤ 10, incluida λ", "finito"], ["L1* ∩ L2⁺", "{λ}", "1"], ["L1⁺ ∩ L2*", "Φ", "0"], ["L1⁺ − (L1²)*", "secuencias de a y b de longitud impar", "∞"], ["(L2.L1)⁺", "secuencias sin dos números consecutivos que terminan en letra", "∞"]] } }] },
      { id: "1.4", txt: "<p>Gramáticas para: a) secuencias de cinco dígitos; b) sus palíndromos; c) secuencias de {a,b} sin dos a consecutivas; d) naturales impares sin ceros no significativos.</p>", sol: [{ f: "a) S → AAAAA      A → 0|1|…|9\nb) S → 0A0|…|9A9   A → 0B0|…|9B9   B → 0|…|9\nc) S → abS | bS | a | λ\nd) S → 1Y|2X|3Y|…|9Y   X → 1Y|2X|…|9Y|0X   Y → 1Y|2X|…|9Y|0X|λ" }] }
    ], alumnos: [
      { id: "2.1", tag: "operaciones con palabras", txt: "<p>Sean x = 111, y = 211, z = 10 palabras sobre Σ = {1, 2, 10}. Completar el cuadro con la definición o el resultado: y², (yz)², z⁻¹y², xy, ? → λ, ? → 111112111, (xy)⁻¹, |(yz)²|, ? → 11121110, (xz)⁻¹, ? → 5, |y²z³|, ? → 1010, |(zx)⁴|₁, |(yx)ⁿ|₁.</p>", sug: 1, sol: [
        { note: "10 es <b>un solo símbolo</b>. Las longitudes se cuentan en símbolos: |z| = 1, |y| = 3." },
        { table: { mono: true, h: ["Definición", "Resultado"], r: [["y²", "211211"], ["(yz)²", "2111021110"], ["z⁻¹y²", "10211211 (z⁻¹ = 10)"], ["xy", "111211"], ["x⁰ (o cualquier potencia 0)", "λ"], ["x.y⁻¹.x", "111112111"], ["(xy)⁻¹", "112111"], ["|(yz)²|", "8"], ["x.y.z", "11121110"], ["(xz)⁻¹", "10111"], ["|xy|₁", "5"], ["|y²z³|", "9"], ["z²", "1010"], ["|(zx)⁴|₁", "12"], ["|(yx)ⁿ|₁", "5n"]] } }] },
      { id: "2.2", tag: "potencias de Σ", txt: "<p>Con Wₖ el conjunto de todas las palabras de longitud k sobre Σ = {a, b}, obtener a) W1, b) W3, c) W5, d) W0. e) ¿Cardinalidad de Wn? f) ¿Y para palabras de longitud n con m símbolos?</p>", sol: [{ ul: ["W1 = {a, b}", "W3 = {aaa, aab, aba, abb, baa, bab, bba, bbb}", "W5 = las 32 secuencias de a y b de longitud 5", "W0 = {λ}", "|Wn| = 2ⁿ", "Con m símbolos: mⁿ"] }] },
      { id: "2.3", tag: "operaciones con lenguajes", txt: "<p>L1 = {a, ba}, L2 = {a, b, ba}, L3 = {a, b}, L4 = {a, ab}, L5 = {b, λ} sobre Σ = {a, b}. Resolver, indicar cardinalidad y describir con palabras los infinitos: a) L1⁺ b) L2³ c) L2* d) (L4*)⁻¹ e) L5¹⁰ f) ~(L5² ∪ L2) g) L2* − (L1*.L5) h) (L3 ∪ L5)ⁿ i) L5⁺ ∩ ~L2* j) ~(L3⁺ ∪ L2⁺) k) L1²⁰ l) ~L1* m) L5.L4⁺ n) L4* − L1⁺ o) (L3²)⁺ p) (L3.L5⁺)⁻¹</p>", sug: 1, sol: [{ table: { h: ["", "Resultado", "Card."], r: [
        ["a", "Secuencias no vacías que terminan en a y donde toda b va seguida de a", "∞"], ["b", "26 palabras de longitud 3 a 6 (aaa, aab, …, bababa)", "26"], ["c", "Σ*: todas las secuencias de a y b, con λ (porque a, b ∈ L2)", "∞"],
        ["d", "{a, ba}*: λ o secuencias donde toda b va seguida de a", "∞"], ["e", "{λ, b, bb, …, b¹⁰}", "11"], ["f", "Todas las secuencias excepto λ, a, b, ba y bb", "∞"],
        ["g", "Secuencias que contienen bb (L1*.L5 son las que no tienen b consecutivas)", "∞"], ["h", "Secuencias de a y b de longitud ≤ n, con λ", "2ⁿ⁺¹ − 1"], ["i", "Φ (L2* = Σ*)", "0"],
        ["j", "{λ}", "1"], ["k", "Concatenaciones de 20 bloques a o ba (todas distintas)", "2²⁰"], ["l", "Secuencias con alguna b que no va seguida de a (contienen bb o terminan en b)", "∞"],
        ["m", "Secuencias con al menos una a y sin b consecutivas", "∞"], ["n", "{λ} ∪ secuencias que empiezan con a, terminan con b y no tienen b consecutivas", "∞"], ["o", "Secuencias de longitud par ≥ 2", "∞"], ["p", "{bⁿa / n ≥ 0} ∪ {bⁿ / n ≥ 1}", "∞"]] } }] },
      { id: "2.4", tag: "operaciones combinadas", txt: "<p>L1 = {a, b}, L2 = {aa, ba}, L3 = {λ, 1, 2}, L4 = {a, 2}, L5 = {b, λ} sobre Σ = {a, b, 1, 2}. Encontrar operaciones que den: a) Φ b) {λ} c) {bb} d) {a, b, ba, bb} e) {aa, aa1, aa2, ab, ab1, ab2} f) secuencias de letras de long ≥ 0 g) letras de long 10 h) números de long &lt; 10 i) letras de long &gt; 10 j) letras de long impar k) letras de long par que terminan en a l) long par no múltiplo de 3 m) al menos una letra n) empiezan con letra sin números consecutivos o) empiezan y terminan con letra sin números consecutivos.</p>", sug: 1, sol: [{ f: "a) L1 ∩ L3                 b) L3 ∩ L5                c) L5² − L5\nd) L5 . L1                 e) L2⁻¹ . L3              f) L1*\ng) L1¹⁰                    h) L3⁹                    i) L1¹¹ . L1*\nj) L1 . (L1²)*             k) L1.(L1²)*.(L1 ∩ L4)\nSea A = (L1 ∪ L3) − (L3 ∩ L5) = {a,b,1,2} y D = L3 − L5 = {1,2}\nl) (A²)* − (A⁶)*           m) A* . L1 . A*\nn) L1 . (L3 . L1)* . L3    o) L1 . (L3 . L1)*" }, { p: "Hay muchas respuestas válidas: verificá la tuya con dos o tres palabras de ejemplo y con una que no debería estar." }] },
      { id: "2.5", tag: "elegir operaciones", txt: "<p>Σ = {a, b, 0, 1}, L1 = {a, b}, L2 = {λ, 1, 0}, L3 = {a, ab}, L4 = {01, 10}. Determinar qué operaciones de la tabla dan cada lenguaje: {aa, baa, ab, bab}; secuencias sin letras; long &lt; 8 con 0 y 1; long &gt; 8 con 0 y 1; long = 8 con 0 y 1; dos o más letras que empiezan con a sin b consecutivas; long impar con a, b; al menos una letra.</p>", sol: [{ table: { h: ["Lenguaje", "Operaciones correctas"], r: [
        ["{aa, baa, ab, bab}", "L3⁻¹.L1 y (L1.L3)⁻¹"], ["Sin letras", "L2⁺, (L2²)⁺, L2*, (L2*)³ (todas: λ ∈ L2)"], ["Long &lt; 8 con 0 y 1", "L2⁷ y L2⁷ ∪ L2⁶"], ["Long &gt; 8 con 0 y 1", "L2* − L2⁸"],
        ["Long = 8 con 0 y 1", "L2⁸ − L2⁷ y (L2 − L1*)⁸"], ["Dos o más letras, empiezan con a, sin bb", "L3⁺ − L1"], ["Long impar con a, b", "(L1²)*.L1, L1⁺ − (L1²)⁺, L1* − (L1²)*"], ["Al menos una letra", "~(L2)*"]] } }, { note: "Verificado por fuerza bruta hasta longitud 6." }] },
      { id: "2.6", tag: "potencias", txt: "<p>Sea L = {λ, x}. Obtener Lⁿ para n = 0, 1, 2, 3. ¿Cuántos elementos tiene Lⁿ? ¿Cuáles son sus palabras?</p>", sol: [{ f: "L⁰ = {λ}   L¹ = {λ, x}   L² = {λ, x, xx}   L³ = {λ, x, xx, xxx}\nLⁿ = {xᵏ / 0 ≤ k ≤ n}  →  |Lⁿ| = n + 1" }] },
      { id: "2.7", tag: "palíndromos", txt: "<p>Sea Σ = {a, o, m, r, ba, bo, le, li, te, se, re}. Encontrar los palíndromos de Σ* que sean palabras válidas del castellano, de longitud 1, 2 y 3.</p>", sug: 1, sol: [{ p: "La longitud se cuenta en <b>símbolos</b> del alfabeto, por eso todo símbolo solo es palíndromo." }, { ul: ["Longitud 1: a, o, le, te, se, re", "Longitud 2: ba.ba = baba, bo.bo = bobo", "Longitud 3: a.m.a = ama, a.r.a = ara, o.r.o = oro, a.le.a = alea, a.se.a = asea, a.te.a = atea, a.re.a = area, a.li.a = alia, o.le.o = oleo, o.re.o = oreo, ba.r.ba = barba"] }, { note: "Ignorando tildes. La lista depende del diccionario que acepte la cátedra." }] },
      { id: "2.8", tag: "expresiones con L", txt: "<p>Con L = {a, b}, definir con expresiones de L los lenguajes de palabras de: a) longitud impar; b) longitud par que no sea múltiplo de 3; c) longitud múltiplo de 3 o de 5; d) longitud que no sea múltiplo de 5 ni de 7.</p>", sol: [{ f: "a) L . (L²)*\nb) (L²)* − (L⁶)*\nc) (L³)* ∪ (L⁵)*\nd) L* − ((L⁵)* ∪ (L⁷)*)" }] },
      { id: "2.9", tag: "lenguajes de datos", txt: "<p>Definir alfabeto, lenguajes base y operaciones para: a) código de producto N-F (N de 1 a 3 dígitos, F de 2 a 5 mayúsculas); b) precio E.D (E entero sin signo de hasta 6 dígitos, D dos dígitos); c) patente de vehículo en sus dos formatos; d) correo electrónico; e) CUIL.</p>", sug: 1, sol: [{ f: "D = {0,…,9}  N = {1,…,9}  Z = {0}  M = {A,…,Z}  m = {a,…,z}\nG = {-}  P = {.}  E = {□}  R = {@}  U = {_}\na) D.(D ∪ Lλ)² . G . M² . (M ∪ Lλ)³\nb) (Z ∪ N.(D ∪ Lλ)⁵) . P . D²\nc) M³.E.D³  ∪  M².E.D³.E.M²          (AAA 999 y AA 999 AA)\nd) (m∪D).(m∪D∪P∪U∪G)* . R . (m∪D∪G)⁺ . (P.(m∪D∪G)⁺)* . P . m² . m*\ne) {20, 23, 24, 27} . G . D⁸ . G . D" }] },
      { id: "2.10", tag: "diseño de gramáticas", txt: "<p>Gramáticas sobre Σ = {a, b} y cuatro derivaciones de distinta longitud para: a) longitud impar; b) exactamente tres a; c) palíndromos de longitud par que empiezan con b; d) sin b consecutivas; e) al menos dos a consecutivas; f) cantidad par de a e impar de b; g) aⁿbⁿ, n ≥ 0; h) números reales sin ceros no significativos con Σ = {0,…,9, −, +, •}.</p>", sug: 1, sol: [{ f: "a) S → aA | bA | a | b        A → aS | bS\nb) S → bS | aA   A → bA | aB   B → bB | aC   C → bC | λ\nc) S → bAb      A → aAa | bAb | λ\nd) S → aS | bA | λ             A → aS | λ\ne) S → aS | bS | aaA           A → aA | bA | λ\nf) S → aA | bB   A → aS | bC   B → aC | bS | λ   C → aB | bA\n   (S: a par b par · A: a impar · B: b impar · C: ambas impares)\ng) S → aSb | λ\nh) S → +E | -E | E    E → 0 | 0P | UR    R → DR | P | λ\n   P → •F    F → DF | U    D → 0 | U    U → 1 | … | 9" }, { p: "Ejemplo b): S ⇒ bS ⇒ baA ⇒ baaB ⇒ baabB ⇒ baabaC ⇒ baaba." }] },
      { id: "2.11", tag: "jerarquía de Chomsky", txt: "<p>Para cada conjunto de producciones: formalizar, indicar el mayor tipo justificando, obtener 3 palabras de longitud &gt; 4 y enunciar el lenguaje.</p><p>a) S → Sxx | By · A → Azz | zz · B → By | A<br>b) S → aDS | a · aD → Da · Da → aD · aDa → aya · DD → D<br>c) S → SRW | a · WR → RW · baa → λ · Y → b · R → aba<br>d) S → HL | MN | 0 · N → HL | MN | 0 · M → 1 · H → 0 · L → HN | ML | 1<br>e) S → 0Xx | 0x · X → YXx · X → 00 · YX → XYY · YYx → 0xx<br>f) S → bSE | xSE · S → xR | bT | 1Q · E → x | b | 1 · R → b · Q → 1 · T → x<br>g) S → wV | bX · V → wS | bZ | b · X → wZ | bS | w · Z → wX | bV<br>h) S → ASB | y · Ay → yA · A → x · B → y<br>i) S → 0QC | xS | cS | λ · QC → 0xB | xQC | cQC · xB → 0S | xxB | cxB<br>j) S → aZ · X → bX | b · Z → aX | Sc<br>k) S → Sa | Xaaa · X → Yb | Ybb | Y · Y → Ycc | λ<br>l) S → ASB | AB · BB → B · A → x · B → y</p>", sug: 1, sol: [{ table: { h: ["", "Tipo", "Justificación", "Lenguaje"], r: [
        ["a", "3", "Todas N → Nw o N → w (regular por izquierda)", "{ z²ⁿ yᵐ x²ᵏ / n ≥ 1, m ≥ 1, k ≥ 0 }"],
        ["b", "0", "DD → D es compresora", "{a} ∪ secuencias de a e y que empiezan y terminan con a, sin y consecutivas, con al menos una y"],
        ["c", "0", "baa → λ es compresora", "{ a } (W nunca desaparece)"],
        ["d", "2", "Parte izquierda de longitud 1; S → HL no es regular (está en FNC)", "Secuencias de 0 y 1 con cantidad impar de 0"],
        ["e", "1", "Hay contexto (YX, YYx) y ninguna regla es compresora", "{0x, 000x} ∪ { 0⁴x²(0x²)ⁿx / n ≥ 0 }"],
        ["f", "2", "S → bSE no es regular", "{ w c v / w ∈ {b,x}ⁿ, c ∈ {xb, bx, 11}, v ∈ {x,b,1}ⁿ, n ≥ 0 }"],
        ["g", "3", "Regular por derecha", "Secuencias de w y b con cantidad impar de w y cantidad impar de b"],
        ["h", "1", "Ay → yA tiene contexto y no es compresora", "{ w ∈ {x,y}* / |w|y = |w|x + 1 }"],
        ["i", "0", "S → λ con S a la derecha (xB → 0S, S → xS) rompe la excepción de tipo 1", "{ w ∈ {0,x,c}* / |w|₀ múltiplo de 3 }"],
        ["j", "2", "Mezcla Z → Sc (izquierda) con S → aZ (derecha)", "{ aᵏ⁺² bᵐ cᵏ / k ≥ 0, m ≥ 1 }"],
        ["k", "3", "Regular por izquierda (con reglas unitarias y de borrado)", "{ c²ⁿ bᵐ aᵏ / n ≥ 0, 0 ≤ m ≤ 2, k ≥ 3 }"],
        ["l", "0", "BB → B es compresora", "{ xⁿ yᵐ / n ≥ 1, 1 ≤ m ≤ n }"]] } }, { note: "Lenguajes verificados generando todas las palabras cortas con un programa. En e) y b) la descripción es la sugerida; justificá con derivaciones." }] }
    ] },
    control: [
      { t: "vf", kind: "teoría", q: "Es lo mismo el lenguaje vacío que el lenguaje que contiene solamente la palabra vacía.", a: false, why: "Φ = { } no tiene elementos; Lλ = {λ} tiene uno." },

      { id: "afnd", title: "Autómatas finitos no deterministas", blocks: [
        { p: "Son AF cuya función de transición tiene como rango la potencia del conjunto de estados, <b>2^Q</b>. Según el dominio hay tres modelos:" },
        { table: { h: ["Modelo", "Dominio", "Rango", "Estado inicial"], r: [["AFND", "Q × Σ", "2^Q", "Puede ser más de uno"], ["AF-λ", "Q × (Σ ∪ {λ})", "2^Q", "Único"], ["AF-Lazy", "Q × Σ*", "2^Q", "Único"]] } },
        { note: "Esta tabla se tomó en el Tema C 2026 (completar AFND, AF-λ o AF-Lazy según dominio, rango y estado inicial)." },
        { fa: S.afnd2, cap: "AFND2: desde 1 con b puede quedarse en 1 o ir a 2." },
        { sim: "afnd2" },
        { ex: "Asociación entre AF y GR (con un solo estado inicial)", b: [{ f: "AF ⇒ GR:  ΣN = Q   ΣT = Σ   S = q0\n          f(q, w) = p  ⇒  q → wp\n          q ∈ F        ⇒  q → λ\nGR ⇒ AF:  Q = ΣN ∪ {E}   q0 = S   F = {E}\n          N1 → wN2  ⇒  f(N1, w) = N2\n          N1 → w    ⇒  f(N1, w) = E" }, { p: "Si w tiene más de un símbolo o es λ, el AF resultante es un AF-Lazy o un AF-λ." }] },

      { id: "thompson", title: "De ER a AF-λ y de AF-λ a AFD", blocks: [
        { def: "Construcciones de Thompson", txt: "Plantillas de AF-λ para ER sencillas (x, λ, Φ, x.y, x+y, x*). Método: 1) construir el AF-λ de cada símbolo; 2) operar los AF-λ según la ER; 3) se recomienda unificar los estados finales en cada paso." },
        { fa: { type: "afnd", w: 470, h: 170, q0: "0", F: ["5"], states: [{ id: "0", x: 50, y: 85 }, { id: "1", x: 150, y: 40 }, { id: "2", x: 290, y: 40 }, { id: "3", x: 150, y: 130 }, { id: "4", x: 290, y: 130 }, { id: "5", x: 400, y: 85 }], edges: [{ f: "0", t: "1", l: "λ" }, { f: "1", t: "2", l: "x" }, { f: "2", t: "5", l: "λ" }, { f: "0", t: "3", l: "λ" }, { f: "3", t: "4", l: "y" }, { f: "4", t: "5", l: "λ" }] }, cap: "Plantilla de x + y." },
        { fa: { type: "afnd", w: 470, h: 180, q0: "0", F: ["3"], states: [{ id: "0", x: 50, y: 70 }, { id: "1", x: 160, y: 70 }, { id: "2", x: 300, y: 70 }, { id: "3", x: 410, y: 70 }], edges: [{ f: "0", t: "1", l: "λ" }, { f: "1", t: "2", l: "x" }, { f: "2", t: "3", l: "λ" }, { f: "2", t: "1", l: "λ" }, { f: "0", t: "3", l: "λ" }], bends: { "0>3": -38, "2>1": 18, "1>2": 0 } }, cap: "Plantilla de x*: se puede saltear (0 → 3) o repetir (2 → 1)." },
        { def: "Derivada de una ER", txt: "Dx(E) = { w / x.w ∈ E }: de las palabras de E que empiezan con x, el resto sin ese prefijo. Las derivadas distintas son los no terminales de una GR equivalente: si Dx(E1) = E2 (≠ λ, ≠ Φ) se crea E1 → xE2; si λ ∈ Dx(E1), E1 → x; si λ ∈ E0, E0 → λ." },
        { def: "Clausura-λ(T)", tag: "Textual en los V/F", txt: "Es la clausura transitiva del subconjunto T con transiciones λ. Es decir, el subconjunto T más todos los estados a los que se puede llegar desde T con <b>una o más</b> transiciones λ." },
        { def: "Destino(T, x)", tag: "Textual en los V/F", txt: "Es el destino directo de T con la lectura de un símbolo x del alfabeto de entrada. Es decir, el subconjunto de todos los estados a los que tiene transiciones T con el símbolo x." },
        { ex: "Método de construcción de subconjuntos", b: [{ ol: ["El inicial del AFD es Clausura-λ del inicial del AF-λ.", "Para cada símbolo x: Destino del estado y luego su Clausura-λ. Ese subconjunto es el estado al que se transiciona con x.", "Repetir con cada estado nuevo.", "Termina cuando no aparece ningún estado nuevo.", "Son finales los subconjuntos que contienen al menos un final del AF-λ."] }] },
        { fa: S.a4, cap: "AF-λ: G con λ va a I; H con λ va a M." },
        { table: { mono: true, h: ["Estado AFD", "a", "b"], r: [["→ {G,I}", "{H,M}", "{G,I,M}"], ["* {H,M}", "{M}", "{H,M}"], ["* {G,I,M}", "{H,M}", "{G,H,I,M}"], ["* {M}", "{M}", "{H,M}"], ["* {G,H,I,M}", "{H,M}", "{G,H,I,M}"]] } },
        { p: "Al minimizar quedan dos clases: {G,I} inicial no final y todo el resto final. El lenguaje aceptado es Σ⁺ (todas las palabras no vacías)." },
        { sim: "a4" },
        { def: "Complejidad de los AF", txt: "En general el AFD es más rápido que el AF-λ, pero a la vez es más complejo en su estructura de estados, y viceversa. Por eso se opta por el AF-λ para el <b>diseño</b> y por el AFD para la <b>implementación</b>." },
        { table: { mono: true, h: ["Autómata", "Orden espacial", "Orden temporal"], r: [["AF-λ", "|r|", "|w| × |r|"], ["AFD", "2^|r|", "|w|"]] } },
        { note: "Ítem 9 del Tema C: \"un AFD ocupa menos memoria\" es FALSO (es 2^|r|), y \"las transiciones del AFND son proporcionales a la longitud independientemente de los estados\" también es FALSO (es |w|·|r|)." }
      ] },
      { id: "props", title: "Propiedades de los lenguajes regulares", blocks: [
        { ul: ["Todo lenguaje finito es regular.", "Todo LR tiene un AF que lo acepta y una GR que lo genera.", "Son cerrados para unión, concatenación, estrellas, inversa, complemento e intersección.", "También pueden ser generados por gramáticas de mayor tipo (2, 1, 0), por la jerarquía.", "No todos son infinitos."] },
        { def: "Lema de bombeo (lenguajes regulares)", txt: "Si L es regular, aceptado por un AFD con n estados, y contiene una palabra de largo ≥ n, entonces L es infinito. Más aún: para toda w ∈ L con |w| ≥ n existen x, y, z con w = xyz, |y| &gt; 0, |xy| ≤ n y xyⁱz ∈ L para todo i ≥ 0." },
        { p: "Se justifica porque para aceptar w el AFD hace |w| transiciones: si |w| ≥ n pasa dos veces por algún estado, y ese circuito es la parte y que se puede bombear. Con él se prueba que { aᵏbᵏ } <b>no es regular</b>." }
      ] }
    ],
    tp: { n: 2, title: "Lenguajes regulares y autómatas finitos", clase: [
      { id: "1.13", txt: "<p>Obtener un AF-λ para (a.(a + b))*.a*.b y para a*.b.a* + (a.b*.b.a)*.</p>", sol: [{ p: "Aplicar Thompson de adentro hacia afuera: primero a+b, luego a.(a+b), su estrella, luego a*, la concatenación con b. Unificar finales en cada paso." }] },
      { id: "1.9", txt: "<p>Minimizar el AFD del enunciado y simular en JFLAP.</p>", sol: [{ p: "Mismo procedimiento que el ítem 12 del parcial: completo y conexo, P0 = {F, ~F} y refinar." }] }
    ], alumnos: [
      { id: "2.1", tag: "FNC3", txt: "<p>Obtener la GR en FNC3. Para c) pasar de regular izquierda a derecha.</p><p>c) S → Sab | Xb | λ · X → Xa | Z · Y → Sbb | Xaa · Z → Zaa | b<br>d) S → aS | aaS | X · W → abW | a · X → bbX | bcY | λ · Y → cY | aaZ | λ · Z → aaZ | bbZ</p>", sug: 1, sol: [
        { p: "<b>c)</b> Y es inaccesible: se elimina. S está a la derecha y S ⇒* λ: S1 → S | λ. Se eliminan S1 → S y X → Z, luego S → λ, y se reduce la longitud:" },
        { f: "S1 → Ab | Bb | Xb | λ        S → Ab | Bb | Xb\nA → Sa    B → a    X → Xa | Ca | b\nC → Za    Z → Da | b    D → Za" },
        { p: "Pasaje a derecha con el grafo (S1 no está a la derecha; se intercambian S1 y λ y se invierten arcos):" },
        { f: "S1 → aB | bX | bZ | λ     S → aA\nA → bS | b    B → bS | b    X → aX | bS | b\nZ → aC | aD   C → aX    D → aZ" },
        { p: "<b>d)</b> W es inaccesible y Z no termina nunca (inútil), así que cae Y → aaZ. Como S ⇒* λ y está a la derecha, S1 → S | λ; luego se eliminan unitarias, borrado y se reduce:" },
        { f: "S1 → aS | a | aA | aB | bC | bD | bE | bF | λ\nS  → aS | a | aA | aB | bC | bD | bE | bF\nA → aS   B → a   C → bX   D → b   E → cY   F → c\nX → bC | bD | bE | bF      Y → cY | c" },
        { note: "Las tres gramáticas se verificaron generando todas las palabras hasta longitud 8." }] },
      { id: "2.2", tag: "diseño de GR", txt: "<p>GR por derecha o izquierda para: a) empiezan con x y terminan con y; b) al menos dos x; c) cantidad impar de y; d) sin tres x consecutivas; e) { xⁿ yᵐ zᵖ / n par, m ≤ 2, p ≥ 1 }; f) { xⁿ yᵐ / n, m ≥ 1 }.</p>", sol: [{ f: "a) S → xA        A → xA | yA | y\nb) S → yS | xA   A → yA | xB   B → xB | yB | λ\nc) S → xS | yA   A → xA | yS | λ\nd) S → yS | xA | λ   A → yS | xB | λ   B → yS | λ\ne) S → xxS | zD | yA | yyA   A → zD   D → zD | λ\nf) S → xS | xA   A → yA | y" }] },
      { id: "2.3", tag: "ER", txt: "<p>ER sobre Σ = {x, y} para: 1) palabras que contienen tres y; 2) longitud par que comienzan con x; 3) sin y consecutivas.</p>", sol: [{ f: "1) x*.y.x*.y.x*.y.x*\n2) x.(x + y).((x + y).(x + y))*\n3) (x + y.x)*.(λ + y)" }] },
      { id: "2.4", tag: "ER a palabras", txt: "<p>Describir: a) (x + y.x + y.x.x)* b) (x.(x + y))* c) (y + x.y*.x)*.x.y*</p>", sol: [{ ul: ["a) λ y las secuencias donde toda y va seguida de al menos una x (sin y consecutivas y sin terminar en y).", "b) Secuencias de longitud par donde cada símbolo de posición impar es x.", "c) Secuencias con cantidad impar de x."] }] },
      { id: "2.5", tag: "GR a ER", txt: "<p>Obtener la ER de: a) S → yS | xD · C → xS | yD · D → xC | yE | λ · E → aE | bE<br>b) S → bX | ab · X → aaX | Y · Y → aZ | bX · Z → bY | a</p>", sug: 1, sol: [
        { f: "a) E es inútil (nunca termina): D = x.C + λ, C = x.S + y.D\n   D = x.x.S + x.y.D + λ  ⇒  D = (x.y)*.(x.x.S + λ)\n   S = (y + x.(x.y)*.x.x).S + x.(x.y)*\n   S = (y + x.(x.y)*.x.x)* . x.(x.y)*\n\nb) Z = b.Y + a  ⇒  Y = a.b.Y + a.a + b.X  ⇒  Y = (a.b)*.(a.a + b.X)\n   X = (a.a + (a.b)*.b).X + (a.b)*.a.a  ⇒  X = (a.a + (a.b)*.b)*.(a.b)*.a.a\n   S = b.(a.a + (a.b)*.b)*.(a.b)*.a.a + a.b" },
        { note: "Ambas ER se verificaron contra la gramática por fuerza bruta." }] },
      { id: "2.6", tag: "MEF", txt: "<p>Diseñar con Mealy o Moore y convertir al otro criterio: a) detecta las subcadenas xyx sobre {x, y}; b) módulo 5 de la suma parcial de dígitos decimales; c) módulo 3 de la suma parcial de dígitos binarios; d) expendedora de 3 productos ($50, $80, $90) con billetes de $10, $20, $50 y $100, rechaza si supera $100, botón por producto y otro para cancelar o pedir vuelto.</p>", sug: 1, sol: [
        { p: "<b>a) Mealy</b> (salida 1 al completar xyx; admite solapamiento):" },
        { table: { mono: true, h: ["", "x", "y"], r: [["→ q0 (nada)", "q1/0", "q0/0"], ["q1 (vi x)", "q1/0", "q2/0"], ["q2 (vi xy)", "q1/1", "q0/0"]] } },
        { p: "<b>a) Moore equivalente</b>: se desdobla q1 según la salida con que se llega." },
        { table: { mono: true, h: ["Q / s", "x", "y"], r: [["→ A = q0/0", "B", "A"], ["B = q1/0", "B", "C"], ["C = q2/0", "D", "A"], ["D = q1/1", "B", "C"]] } },
        { p: "<b>b) Moore</b>: estados s0 … s4 con salida i. f(sᵢ, d) = s₍ᵢ₊d₎ mod 5 para cada dígito d de 0 a 9. Mealy: un solo estado por resto y la salida en la transición: sᵢ --d / (i+d) mod 5--> s₍ᵢ₊d₎ mod 5." },
        { p: "<b>c) Moore</b>: q0/0, q1/1, q2/2; con 0 se queda, con 1 avanza: q0 → q1 → q2 → q0." },
        { p: "<b>d)</b> Estados = crédito acumulado (C0, C10, …, C100). Entradas: B10, B20, B50, B100, P1, P2, P3, V. Con un billete se suma si no supera 100; si supera, la salida es <i>rechaza billete</i> y se queda. Con Pk, si el crédito alcanza el precio se entrega el producto y se pasa a C(crédito − precio); si no alcanza, salida <i>crédito insuficiente</i>. V devuelve el crédito y vuelve a C0. Es natural en Mealy (la salida depende del botón y del crédito)." }] },
      { id: "2.7", tag: "AFD", txt: "<p>Q = {A,B,C,D,E}, Σ = {x,y,z}, q0 = A, F = {A, D}; f(A,x)=B, f(A,y)=C, f(B,x)=B, f(B,z)=D, f(C,y)=E, f(D,x)=D, f(D,y)=B, f(E,x)=C, f(E,z)=B. Identificar generadores y sumideros, completo y conexo; cinco palabras aceptadas y tres rechazadas.</p>", sol: [
        { fa: { type: "afd", w: 470, h: 250, q0: "A", F: ["A", "D"], loops: { B: "up", D: "up" }, states: [{ id: "A", x: 60, y: 125 }, { id: "B", x: 220, y: 60 }, { id: "D", x: 400, y: 60 }, { id: "C", x: 220, y: 200 }, { id: "E", x: 400, y: 200 }], delta: { A: { x: "B", y: "C" }, B: { x: "B", z: "D" }, C: { y: "E" }, D: { x: "D", y: "B" }, E: { x: "C", z: "B" } } } },
        { ul: ["Conexo: sí, desde A se llega a todos.", "Completo: no. Falta, por ejemplo, f(A,z), f(B,y), f(C,x)… Se agrega un sumidero Z al que van todas las faltantes.", "Generador: A (no le llegan transiciones). Sumidero: no hay hasta agregar Z.", "Aceptadas: λ, xz, xxz, xzx, xzyz, yyzz.", "Rechazadas: x, yy, xzy."] }] },
      { id: "2.8", tag: "minimización", txt: "<p>Minimizar los cuatro AFD del enunciado (a y b sobre {x,y}, c sobre {p,q}, d sobre {0,1}).</p>", sug: 1, sol: [
        { note: "Las tablas se reconstruyeron del PDF; verificá que coincidan con tu copia." },
        { table: { mono: true, h: ["", "Particiones", "AFD mínimo"], r: [
          ["a", "P0 [I,G,C,E,H][A,D,F,B] · P1 [I,C,E,H][G][A,D,F,B] · P2 [I,C][E,H][G][A,F][D,B]", "5 estados: →[AF] · *[IC] · *[EH] · *[G] · [DB]"],
          ["b", "Accesibles B,J,D,C,A,G,I · P0 [B,D,G][J,C,A,I] · P1 [B][D,G][J,A][C,I] · P2 [B][D,G][J][A][C,I]", "5 estados: →*[B] · *[DG] · [J] · [A] · [CI]"],
          ["c", "Accesibles I,B,A,D,H,C,F · P0 [A,H,C][I,B,D,F] · P1 [A,H,C][I,B][D][F] · P2 [A,H,C][I][B][D][F]", "5 estados: →[I] · *[AHC] · [B] · [D] · [F]"],
          ["d", "P0 [J,F,D,B,G,E][A,C,I,H] · P1 [J,B,E][F,D,G][A,I][C,H] · P2 [J,E][B][F][D,G][A,I][C,H]", "6 estados: →[AI] · *[JE] · *[B] · *[F] · *[DG] · [CH]"]] } }] },
      { id: "2.9", tag: "isomorfismo", txt: "<p>Para cada par de AFD, minimizar y comprobar equivalencia por isomorfismo.</p>", sug: 1, sol: [
        { p: "<b>a)</b> Izquierdo: [AB]* (x→GE, y→AB), →[C] (x→GE, y→AB), [GE] (x→DHI, y→AB), [DHI] (x→DHI, y→C). Derecho: *M (x→L, y→M), →K (x→L, y→M), L (x→P, y→M), P (x→P, y→K). Con ß: C↦K, AB↦M, GE↦L, DHI↦P se cumplen las tres condiciones: <b>son equivalentes</b>." },
        { p: "<b>b)</b> Izquierdo: *[C], →[A], [DF], [BE] (sumidero). Derecho: *[LJ], →[G], [H], [I], sin sumidero. No hay biyección que respete las transiciones: <b>no son equivalentes</b> (10111 es aceptada por el derecho y rechazada por el izquierdo)." }] },
      { id: "2.10", tag: "modelos de AF", txt: "<p>Indicar si son deterministas; si no, qué modelo son, sus componentes y palabras aceptadas y rechazadas. A1 sobre {a,b}; A2 con columnas x, y, xy, yy, xxx; A4 con columnas a, b, λ.</p>", sug: 1, sol: [
        { ul: ["<b>A1</b>: cada celda tiene a lo sumo un estado y hay un solo inicial: es un <b>AFD incompleto</b> (las llaves son solo notación).", "<b>A2</b>: tiene transiciones con secuencias (xy, yy, xxx): es un <b>AF-Lazy</b>, dominio Q × Σ*.", "<b>A4</b>: tiene columna λ: es un <b>AF-λ</b>. Su AFD equivalente acepta Σ⁺ (ver sección 2.6)."] }] },
      { id: "2.12", tag: "GR a AF", txt: "<p>Obtener un AF para: a) S → aX | bW | a · W → aY | bS | a · X → aZ | bS · Y → aX | bY | a | b · Z → aZ | bZ<br>b) S → abX | bbY | aaW | λ · T → baS | abY · V → aS | bbX | baY · X → abT | bbbS | aaZ · Y → T | aaX | λ · Z → abZ | bbZ</p>", sol: [
        { p: "<b>a)</b> Z es inútil (no termina): se quita X → aZ. Q = {S, W, X, Y, E}, F = {E}. Es un <b>AFND</b> porque f(S, a) = {X, E}, f(W, a) = {Y, E}, f(Y, a) = {X, E}, f(Y, b) = {Y, E}." },
        { p: "<b>b)</b> W no tiene reglas y Z no termina: se eliminan. V es inaccesible. Transiciones con secuencias (ab, bb, bbb, ba, aa) y con λ (Y → T y S → λ, Y → λ hacia E): es un <b>AF-Lazy</b>." }] },
      { id: "2.13", tag: "operaciones con AF", noDef: 0, txt: "<p>Resolver A3* ∪ A1, (A2.A1)⁺ y (~A1).A3, indicando si el resultado es determinista.</p>", sol: [{ p: "Unión y concatenación con transiciones λ desde un inicial nuevo y desde los finales: el resultado es un <b>AF-λ</b>. Para el complemento, primero completar A1 y luego invertir finales." }] },
      { id: "2.14", tag: "Thompson", txt: "<p>Obtener un AF-λ para: a.(b + a.b)*.a + (a.a + b.b)*.(b.b + a) + a · (a.b*.(a + b) + a*.b.b)* · (a.a)*.b.a*.(b.a)* + (a.a.b*.a + b*.a.a.b)*</p>", sol: [{ p: "Construir de adentro hacia afuera con las plantillas de Thompson: cada símbolo, luego concatenaciones (λ entre bloques), uniones (inicial y final nuevos con λ) y estrellas (salteo y retorno con λ). Verificar en JFLAP con un par de palabras de cada rama de la unión." }] },
      { id: "2.15", tag: "AFND a AFD", txt: "<p>Obtener el AFD mínimo del AFND A1: →A: a{B,D} b{A} · B: a{D} b{C} · *C: a{B} b{C,D} · D: a{D} b{B}.</p>", sol: [
        { table: { mono: true, h: ["Subconjunto", "a", "b"], r: [["→ {A}", "{B,D}", "{A}"], ["{B,D}", "{D}", "{B,C}"], ["{D}", "{D}", "{B}"], ["* {B,C}", "{B,D}", "{C,D}"], ["{B}", "{D}", "{C}"], ["* {C,D}", "{B,D}", "{B,C,D}"], ["* {C}", "{B}", "{C,D}"], ["* {B,C,D}", "{B,D}", "{B,C,D}"]] } },
        { p: "Minimizando: P0 = {finales}{A, BD, D, B} → P1 separa [A,D] de [BD,B] → P2 separa A de D. Quedan 4 estados: →[A] (a→[BD,B], b→[A]), [D] (a→[D], b→[BD,B]), [BD,B] (a→[D], b→F), F = todos los finales (a→[BD,B], b→F)." }] }

      { id: "2.4", tag: "BNF", txt: "<p>Expresar en BNF con metacaracteres: a) S → XYZ · X → aX | λ · Y → aaYc | a · Z → cc | λ<br>b) S → aSa | bSb | XYd · X → cc | cd · Y → Ydd | λ</p>", sol: [{ f: "a) ⟨S⟩ ::= { a } ⟨Y⟩ [ cc ]\n   ⟨Y⟩ ::= aa ⟨Y⟩ c | a\nb) ⟨S⟩ ::= a ⟨S⟩ a | b ⟨S⟩ b | c ( c | d ) { dd } d" }] },

          ["f", "0: (x,#,X#)(x,X,XX)→0 · (y,X,λ)→1 · (y,#,#)→2 — 1: (y,X,λ)→1 · (y,#,#)→2 — 2: (y,#,#)→2 · (∆,#,λ)→f"]] } },

      { id: "2.8", tag: "FNC", txt: "<p>Simplificar y pasar a FNC: a) S → aaS | X · W → abX | bbZ · X → aaX | bY | aZ · Y → bYa | aaY · Z → bZa | bbT | ba<br>b) S → aX | bZa | λ · X → bS | Z · Y → abX | ZXa · Z → bZa | b<br>c) S → bY | ZX · X → aXb | λ · Y → abb | bZ · Z → aZb | λ</p>", sug: 1, sol: [
        { p: "<b>a)</b> W es inaccesible; Y nunca termina y T no tiene reglas: se eliminan. Queda S → aaS | X · X → aaX | aZ · Z → bZa | ba. Sin unitarias: S → aaS | aaX | aZ. FNC:" },
        { f: "S → AC | AD | AZ    C → AS    D → AX\nX → AD | AZ         Z → BE | BA    E → ZA\nA → a    B → b           L = { a^impar bᵏ aᵏ / k ≥ 1 }" },

        { p: "<b>a)</b> W no tiene reglas e Y no termina: se eliminan; T y V quedan inaccesibles. S → aaX | λ, X → Sb | Z, Z → Xb | aa. Como S está a la derecha y genera λ: S1 → S | λ. Sin borrado ni unitarias: X → Sb | b | Xb | aa. Se elimina la recursividad X → Xb con X' (Q) y se sustituye S al inicio:" },

    cards: [
      { tag: "MEF", q: "¿Qué es una MEF y por qué sirve para controlar el ascensor?", a: "Una máquina secuencial que produce una secuencia de salida de igual longitud y en correspondencia con la de entrada, pero que depende también del estado. El ascensor es un sistema de control secuencial: su reacción a un botón depende de dónde está y qué está haciendo." },
      { tag: "MEF", q: "Definí formalmente la MEF y decí qué es cada componente en el ascensor de 2 pisos.", a: "MEF = ⟨Q, ΣE, ΣS, f, g⟩. Q = {Q0, Q1, Q2, Q3}; ΣE = combinaciones de B1, B2, FC1, FC2; ΣS = {STOP, SUBIR, BAJAR} (más el símbolo del display); f: Q × ΣE ⇒ Q la tabla de transición; g: Q ⇒ ΣS la tabla de salida." },
      { tag: "Moore/Mealy", q: "¿El ejemplo es Mealy o Moore? ¿Cómo te das cuenta?", a: "Moore: la salida (motor y display) depende solo del estado. Q1 siempre sube y muestra S, sin importar qué entrada llegó." },
      { tag: "Moore/Mealy", q: "¿Qué diferencia hay entre Mealy y Moore al implementarlas?", a: "En Mealy la salida es instantánea: primero se obtiene la salida (según estado actual y entrada) y luego el estado nuevo. En Moore hay retardo: primero se transiciona y después se escribe la salida, que depende solo del estado nuevo." },
      { tag: "Moore/Mealy", q: "¿Cómo pasás una MEF de Moore a Mealy?", a: "Mismos estados; por cada f(q, e) = p con g(p) = s se define g'(q, e) = s. La salida pasa a la transición que llega al estado." },
      { tag: "Moore/Mealy", q: "¿Cómo pasás una MEF de Mealy a Moore?", a: "Se desdobla cada estado según la salida con que se llega: por cada f(q,e) = p con g(q,e) = s se crea pₛ con g'(pₛ) = s. Si a un estado no llegan transiciones se crea q_λ." },
      { tag: "Tabla", q: "¿Qué representa el número de fila en tablaTran?", a: "La combinación de entradas codificada en binario: B1·8 + B2·4 + FC1·2 + FC2, de 0 a 15. Cada fila es un símbolo de entrada de la MEF." },
      { tag: "Tabla", q: "¿Cuántas filas tendría la tabla del ascensor de 4 pisos si se usan todas las entradas binarias?", a: "4 pulsadores + 4 fines de carrera = 8 bits → 2⁸ = 256 combinaciones." },
      { tag: "Tabla", q: "Estando en Q0 llega FC2 = 1 (sin botones). ¿Qué hace la MEF del ejemplo?", a: "Se queda en Q0: esa combinación no está prevista como cambio en ese estado. Solo B2 hace salir de Q0." },
      { tag: "Tabla", q: "En Q0 se aprietan B1 y B2 a la vez. ¿Qué pasa según la tabla?", a: "Filas 12 a 15: pasa a Q1 (subir). Para la tabla manda B2, porque B1 no hace nada estando en planta baja." },
      { tag: "Código", q: "Explicá qué hace el loop() del programa.", a: "Lee las entradas y arma el número de fila, busca el estado nuevo en tablaTran[fila][estado] y escribe las salidas del estado nuevo (motor y display) con las tablas de salida." },
      { tag: "Código", q: "¿Por qué el programa no debe usar delay()?", a: "Porque bloquea: mientras espera no se leen sensores ni botones. El firmware debe ser determinista y no bloqueante para reaccionar en cada ciclo." },
      { tag: "Código", q: "¿Por qué la MEF se implementa con tablas y no con if anidados?", a: "La tabla es la función de transición tal cual el modelo: el programa queda independiente de la lógica, se verifica contra la MEF y se modifica cambiando datos, no código." },
      { tag: "Hardware", q: "¿Para qué sirve el puente H L298N y qué valores toman IN1 e IN2?", a: "Para invertir la polaridad del motor de CC y elegir el sentido de giro. SUBIR: IN1 = 1, IN2 = 0. BAJAR: IN1 = 0, IN2 = 1. STOP: ambos en 0." },
      { tag: "Hardware", q: "¿Por qué los pulsadores llevan resistencia pull-down de 10 kΩ?", a: "Para que la entrada lea LOW estable cuando no se presiona. Sin ella queda flotante y puede leer 1 por ruido." },
      { tag: "Hardware", q: "¿Por qué hay que unir el GND de la fuente externa con el del Arduino?", a: "Porque las señales lógicas necesitan una referencia de tierra común para conmutar los transistores del driver." },
      { tag: "Hardware", q: "¿Qué es un fin de carrera y qué rol cumple en la MEF?", a: "Un micro-switch que se activa cuando la cabina llega a un piso. Es la entrada que provoca la transición de un estado de movimiento a un estado detenido." },
      { tag: "Hardware", q: "¿Qué significa que un pulsador sea normal abierto?", a: "Que en reposo el circuito está abierto (no conduce) y al presionarlo se cierra. Con pull-down: reposo LOW, presionado HIGH." },
      { tag: "Hardware", q: "¿Por qué el display usa pines analógicos?", a: "Porque los 14 digitales no alcanzan. A0 a A5 pueden configurarse como salidas digitales con pinMode()." },
      { tag: "Display", q: "¿Qué segmentos se encienden para mostrar 1, S, 2 y b?", a: "1: B y C. S: A, C, D, F y G. 2: A, B, D, E y G. b: C, D, E, F y G." },
      { tag: "Diseño", q: "¿Cuántos estados necesitás para 4 pisos y por qué?", a: "Una propuesta: 4 detenidos + 3 subiendo hacia un destino + 3 bajando hacia un destino = 10. El estado de movimiento tiene que recordar el destino para saber en qué fin de carrera detenerse." },
      { tag: "Diseño", q: "Estando detenido en el piso 3, se aprieta el botón del piso 3. ¿Qué debería hacer la MEF?", a: "Quedarse en el mismo estado: no hay movimiento que hacer." },
      { tag: "Diseño", q: "¿Cómo agregarías un estado de puerta abierta?", a: "Un estado intermedio entre el movimiento y el reposo (al llegar FCk pasa a Puerta k) y un evento de salida (sensor o temporizador) que lo lleve al reposo. Cambian Q, f y g; la estructura del programa no." },
      { tag: "Teoría", q: "¿De qué modelo es caso particular la MEF? ¿Y el AF de la MEF?", a: "La MEF es un caso particular de la MT. El AF es una MEF de tipo Moore especial, con salidas implícitas (estados de aceptación o rechazo)." },
      { tag: "Teoría", q: "¿Qué es la configuración de una MEF? Dá un ejemplo.", a: "Estado actual, lo que falta leer y lo que se escribió, como s1…si−1 qk ei…en. Ej. MEF1 con 011: q0011 ├─ nq011 ├─ niq11 ├─ nipq2." },
      { tag: "Teoría", q: "¿Qué significa que la MEF sea determinista?", a: "Que para cada estado y cada símbolo de entrada hay una sola transición posible." },
      { tag: "Teoría", q: "¿Qué ventajas tiene representar la MEF como grafo y como tabla?", a: "El grafo se entiende de un vistazo (estados, flechas con entrada y salida). La tabla es completa y se traduce directo a un arreglo en el programa." },
      { tag: "Teoría", q: "En la MEF, ¿la cinta de salida tiene la misma longitud que la de entrada? ¿Por qué?", a: "Sí: por cada símbolo leído se escribe exactamente uno." },
      { tag: "Simulación", q: "¿Para qué se simula en Tinkercad antes del montaje?", a: "Para validar la lógica de la MEF (transiciones por el Serial Monitor) sin riesgo de dañar componentes de potencia." },
      { tag: "Arduino", q: "¿Qué hacen digitalRead, digitalWrite y pinMode?", a: "pinMode configura un pin como entrada o salida; digitalRead lee HIGH o LOW de una entrada; digitalWrite escribe HIGH o LOW en una salida." },
      { tag: "Teoría", q: "En Moore, ¿por qué se dice que la salida sufre un retardo?", a: "Porque primero se transiciona según el símbolo leído y el estado actual, y recién después se escribe la salida, que depende solo del estado al que se llegó." }
    ]
  });

    blocks: [
      { p: "A partir de las reglas léxicas y sintácticas del subconjunto <b>LMD</b> (Lenguaje de Manipulación de Datos) de SQL, construir un <b>parser en Java</b> con las herramientas de metacompilación <b>JLex</b> y <b>Cup</b>, que detecte errores sintácticos en un archivo de texto con sentencias LMD." },
      { html: lab2pipe },
      { table: { h: ["Herramienta", "Parte de", "Genera", "Teoría detrás"], r: [["JLex", "Expresiones regulares de los componentes léxicos", "Scanner (analizador léxico) en Java que devuelve tokens", "Unidad 2: ER → AF-λ → AFD"], ["Cup", "GIC descripta en notación BNF", "Parser (analizador sintáctico) en Java", "Unidad 3: GIC, AP, análisis ascendente (LALR)"]] } },
      { ex: "Estructura de un archivo JLex", b: [{ f: "código de usuario (import java_cup.runtime.*;)\n%%\n%cup  %line  %char            ← directivas\nDIGITO=[0-9]\nID=[a-zA-Z_][a-zA-Z0-9_]*      ← macros (ER)\n%%\n\"SELECT\"   { return new Symbol(sym.SELECT); }\n{ID}       { return new Symbol(sym.ID, yytext()); }\n{DIGITO}+  { return new Symbol(sym.NUM, yytext()); }\n[ \\t\\r\\n]+ { /* ignorar */ }\n.          { System.out.println(\"Error léxico: \" + yytext()); }" }] },
      { ex: "Estructura de un archivo Cup", b: [{ f: "import java_cup.runtime.*;\nparser code {: public void syntax_error(Symbol s) { … } :};\n\nterminal SELECT, FROM, WHERE, INSERT, INTO, VALUES, UPDATE, SET, DELETE;\nterminal COMA, PCOMA, PAR_A, PAR_C, IGUAL, ID, NUM, CADENA;\nnon terminal programa, sentencia, lista_campos, lista_valores, condicion;\n\nstart with programa;\n\nprograma  ::= programa sentencia | sentencia ;\nsentencia ::= SELECT lista_campos FROM ID PCOMA\n            | SELECT lista_campos FROM ID WHERE condicion PCOMA\n            | DELETE FROM ID WHERE condicion PCOMA ;\nlista_campos ::= lista_campos COMA ID | ID ;" }] },
      { f: "⟨select⟩ ::= SELECT ( * | ⟨campo⟩ { , ⟨campo⟩ } ) FROM ⟨tabla⟩ { , ⟨tabla⟩ } [ WHERE ⟨cond⟩ ] [ ORDER BY ⟨campo⟩ ] ;\n⟨insert⟩ ::= INSERT INTO ⟨tabla⟩ [ ( ⟨campo⟩ { , ⟨campo⟩ } ) ] VALUES ( ⟨valor⟩ { , ⟨valor⟩ } ) ;\n⟨update⟩ ::= UPDATE ⟨tabla⟩ SET ⟨campo⟩ = ⟨valor⟩ { , ⟨campo⟩ = ⟨valor⟩ } [ WHERE ⟨cond⟩ ] ;\n⟨delete⟩ ::= DELETE FROM ⟨tabla⟩ [ WHERE ⟨cond⟩ ] ;" },
      { tree: "sentencia( SELECT lista_campos( lista_campos(ID) COMA ID ) FROM ID PCOMA )", gx: 66, cap: "Árbol sintáctico de SELECT nombre, edad FROM alumnos ;" },
      { note: "Material de la cátedra: guía de instalación de JLex, Cup, JDK y NetBeans; sintaxis de los archivos fuente; sintaxis ANSI del LMD; ejemplos calc y lenguaje hipotético C0." }
    ],
    cards: [
      { tag: "Parser", q: "¿Qué es un parser y qué recibe del scanner?", a: "El analizador sintáctico: revisa que la secuencia de tokens respete la estructura de la gramática (GIC) y detecta errores sintácticos. Recibe los tokens que le entrega el scanner." },
      { tag: "Scanner", q: "¿Qué es un scanner y qué es un token?", a: "El analizador léxico: lee los caracteres y reconoce los componentes léxicos. Un token es la categoría del componente (ID, NUM, SELECT, COMA…) más su valor (lexema)." },
      { tag: "JLex", q: "¿De qué parte JLex y qué genera?", a: "De las expresiones regulares de los componentes léxicos, y genera un scanner en Java capaz de obtener los tokens y dárselos al parser." },
      { tag: "Cup", q: "¿De qué parte Cup y qué genera?", a: "De una GIC escrita en notación BNF con las reglas sintácticas, y genera un parser en Java que detecta los errores sintácticos." },
      { tag: "JLex", q: "¿Cómo se estructura un archivo de JLex?", a: "Tres partes separadas por %%: código de usuario; directivas y macros (definiciones regulares); reglas, cada una una ER con la acción en Java que devuelve el token." },
      { tag: "Cup", q: "¿Qué secciones tiene un archivo de Cup?", a: "Imports y código de usuario, declaración de terminales y no terminales, precedencias, start with (axioma) y las producciones con ::=, | y ; (y acciones entre {: :})." },
      { tag: "Cup", q: "¿Qué tipo de análisis hace el parser que genera Cup?", a: "Ascendente: Cup genera parsers LALR(1), que reducen desde las hojas hacia el axioma (derivación más a la derecha en reversa)." },
      { tag: "Teoría", q: "¿Qué modelo matemático reconoce lo que describe Cup? ¿Y JLex?", a: "Cup: GIC → Autómata de Pila (tipo 2, nivel sintáctico). JLex: ER → Autómata Finito (tipo 3, nivel léxico)." },
      { tag: "Teoría", q: "¿Por qué los tokens se describen con ER y la sintaxis con una GIC?", a: "Los componentes léxicos son lenguajes regulares. La sintaxis tiene anidamientos y recursión (paréntesis, listas, sentencias dentro de sentencias) que una GR no puede generar: hace falta tipo 2." },
      { tag: "BNF", q: "¿Qué es la BNF y cuáles son sus metacaracteres?", a: "Una notación para escribir GIC de lenguajes de programación. ::= separa izquierda y derecha, | alternativas, { } repetición, [ ] opcional, ( ) agrupar alternativas, ⟨ ⟩ no terminales." },
      { tag: "Chomsky", q: "¿Qué es una gramática dependiente del contexto?", a: "Tipo 1: sus reglas no pueden tener parte derecha más corta que la izquierda (sin compresoras), salvo S → λ con S fuera de las partes derechas. Generan LDC, nivel semántico, aceptados por un ALL." },
      { tag: "Chomsky", q: "¿En qué nivel de la jerarquía está un lenguaje como SQL? ¿Qué parte cubre cada herramienta?", a: "Su sintaxis es de tipo 2 (Cup). Sus componentes léxicos son de tipo 3 (JLex). La verificación de tipos o de que la tabla exista sería semántica, fuera del parser." },
      { tag: "GIC", q: "¿Qué es una gramática ambigua y por qué es un problema para el parser?", a: "La que da más de un árbol de derivación para una palabra. El parser no sabe qué estructura elegir (conflictos); se resuelve reescribiendo la gramática o declarando precedencias." },
      { tag: "Cup", q: "¿Para qué sirve precedence en Cup?", a: "Para resolver ambigüedades de operadores declarando su prioridad y asociatividad (precedence left OR; precedence left AND;), sin reescribir la gramática." },
      { tag: "GIC", q: "¿Cómo eliminás la ambigüedad de las expresiones aritméticas?", a: "Introduciendo niveles: E → E + T | T, T → T * F | F, F → ( E ) | id. El producto queda más abajo en el árbol y por eso tiene más prioridad." },
      { tag: "SQL", q: "¿Qué es el LMD de SQL y qué sentencias incluye?", a: "El Lenguaje de Manipulación de Datos: SELECT, INSERT, UPDATE y DELETE." },
      { tag: "SQL", q: "Escribí la estructura de un SELECT en BNF.", a: "⟨select⟩ ::= SELECT ( * | ⟨campo⟩ { , ⟨campo⟩ } ) FROM ⟨tabla⟩ [ WHERE ⟨cond⟩ ] ;" },
      { tag: "SQL", q: "Escribí la estructura de un INSERT en BNF.", a: "⟨insert⟩ ::= INSERT INTO ⟨tabla⟩ [ ( ⟨campo⟩ { , ⟨campo⟩ } ) ] VALUES ( ⟨valor⟩ { , ⟨valor⟩ } ) ;" },
      { tag: "Errores", q: "Dá un ejemplo de error léxico y uno sintáctico en una sentencia SQL.", a: "Léxico: un símbolo que ningún patrón reconoce, como SELECT # FROM t (lo detecta el scanner). Sintáctico: SELECT nombre alumnos; (falta FROM) (lo detecta el parser)." },
      { tag: "Errores", q: "¿Quién detecta que una tabla consultada no existe?", a: "Nadie en este laboratorio: es un error semántico (coherencia con las declaraciones), no léxico ni sintáctico." },
      { tag: "JLex", q: "¿Qué es una macro en JLex? Dá un ejemplo.", a: "Un nombre para una expresión regular que se reutiliza en las reglas: DIGITO=[0-9] y luego {DIGITO}+ para los números." },
      { tag: "JLex", q: "¿Qué hace yytext() en JLex?", a: "Devuelve el lexema reconocido, el texto que coincidió con la ER, para guardarlo como valor del token." },
      { tag: "Cup", q: "¿Qué son terminal y non terminal en Cup?", a: "Las declaraciones de los símbolos de la GIC: terminales son los tokens que entrega el scanner; no terminales son las estructuras sintácticas." },
      { tag: "Cup", q: "¿Para qué sirve start with?", a: "Para indicar el axioma de la gramática. Si no está, Cup toma el no terminal de la primera producción." },
      { tag: "Integración", q: "¿Cómo se conectan el scanner y el parser?", a: "El scanner se genera compatible con Cup (%cup) y devuelve objetos Symbol con el código del token definido en sym.java. El parser pide un token por vez." },
      { tag: "Integración", q: "¿Qué archivos genera Cup?", a: "La clase del parser y la clase sym con las constantes de los terminales, que usa el scanner." },
      { tag: "Teoría", q: "¿Qué es un árbol de derivación? Dá uno para una sentencia SELECT.", a: "Árbol con el axioma en la raíz, no terminales en los nodos internos y terminales en las hojas; cada nodo con sus hijos es una regla. SELECT campo FROM tabla; → sentencia(SELECT lista(ID) FROM ID PCOMA)." },
      { tag: "Teoría", q: "¿Por qué un AP necesita la pila para analizar SQL?", a: "Para recordar estructuras abiertas que todavía no se cerraron (paréntesis de una lista de valores, subconsultas, listas recursivas). Un AF no tiene memoria suficiente." },
      { tag: "Teoría", q: "¿Qué diferencia hay entre análisis descendente y ascendente?", a: "Descendente: del axioma hacia las hojas, derivación más a la izquierda (AP desde FNG, pila vacía). Ascendente: de las hojas al axioma, derivación más a la derecha (AP desde FNC, estado final). Cup es ascendente." },
      { tag: "Teoría", q: "¿Qué es una gramática independiente del contexto?", a: "Tipo 2: la parte izquierda de cada regla es un solo no terminal y la derecha cualquier secuencia. Genera LIC, nivel sintáctico, aceptados por un AP." },
      { tag: "Compilación", q: "¿En qué fase del compilador están el scanner y el parser?", a: "En la fase de análisis, junto con el análisis semántico. La síntesis genera código intermedio, lo optimiza y genera código de máquina." },
      { tag: "Herramientas", q: "¿Qué hace falta instalar para el laboratorio?", a: "JDK, NetBeans, JLex (Main.java) y el proyecto java_cup. La cátedra deja la guía de instalación y ejemplos (calc y lenguaje hipotético C0)." }
    ]
  });

  /* ---------- modelo del alumno → especificación ---------- */
  function parse(model, kind) {
    var errs = [], st = {}, delta = {}, out = {}, trans = [], q0s = [], F = [];
    model.states.forEach(function (s) { st[s.id] = s; delta[s.id] = {}; if (s.ini) q0s.push(s.id); if (s.fin) F.push(s.id); if (kind === "moore") out[s.id] = s.out || ""; if (kind === "mealy") out[s.id] = {}; });
    model.trans.forEach(function (t) {
      if (!st[t.f] || !st[t.t]) return;
      var raw = String(t.l || "").trim(); if (!raw) { errs.push("Hay una transición de " + t.f + " a " + t.t + " sin rótulo."); return; }
      if (kind === "afd" || kind === "afnd" || kind === "moore") {
        raw.split(/[,\s]+/).filter(Boolean).forEach(function (a) {
          if (a === "lambda" || a === "\\") a = "λ";
          (delta[t.f][a] = delta[t.f][a] || []).push(t.t);

      } else if (kind === "mealy") {
        raw.split(/\s*,\s*/).filter(Boolean).forEach(function (p) {
          var m = /^(.+?)\s*\/\s*(.*)$/.exec(p); if (!m) { errs.push("En " + t.f + " → " + t.t + ", \"" + p + "\" no tiene la forma entrada/salida."); return; }
          (delta[t.f][m[1]] = delta[t.f][m[1]] || []).push(t.t); out[t.f][m[1]] = m[2];
        });

          if (kind === "ap") trans.push([t.f, x[0], x[1], t.t, x[2]]);
          else {
            var mv = x[2].toUpperCase(); mv = mv === "R" ? "D" : mv === "L" ? "I" : mv;
            if ("IDN".indexOf(mv) < 0 || mv.length !== 1) { errs.push("En " + t.f + " → " + t.t + ", el movimiento debe ser I, D o N."); return; }
            (delta[t.f][x[0]] = delta[t.f][x[0]] || []).push([t.t, x[1], mv]);
          }

      Object.keys(P.delta).forEach(function (q) { Object.keys(P.delta[q]).forEach(function (a) {
        if (a === "λ") e.push("Un " + KIND[kind] + " no admite transiciones λ (estado " + q + ").");
        else if (P.delta[q][a].length > 1) e.push("No es determinista: desde " + q + " con " + a + " hay más de una transición.");
        if (ex.alpha.indexOf(a) < 0 && a !== "λ") e.push("El símbolo " + a + " (desde " + q + ") no está en el alfabeto {" + ex.alpha.split("").join(", ") + "}.");
      }); });

    if (kind === "mt") Object.keys(P.delta).forEach(function (q) { Object.keys(P.delta[q]).forEach(function (a) { if (P.delta[q][a].length > 1) e.push("La MT debe ser determinista: desde " + q + " leyendo " + a + " hay más de una transición."); }); });

  /* ---------- simuladores para corregir ---------- */
  function faAcc(P, w) {

    var cur = clo(P.q0s);

    return cur.some(function (q) { return P.F.indexOf(q) >= 0; });
  }

  function apAcc(P, w, crit) {

    while (queue.length && steps < lim) {

      else if (kind === "mealy" || kind === "moore") { var r = mefOut(P, kind, w), eo = ex.out(w); if (r.blocked != null) bad.push("Con <b>" + show(w) + "</b> tu MEF se bloquea en el símbolo " + (r.blocked + 1) + ": falta una transición."); else if (r.o !== eo) bad.push("Con <b>" + show(w) + "</b> tu MEF escribe <b>" + show(r.o) + "</b> y debería escribir <b>" + show(eo) + "</b>."); }

      var sp = { type: k === "moore" ? "moore" : "afd", w: 640, h: 360, r: 20, states: model.states.map(function (s) { return { id: s.id, x: s.x, y: s.y }; }), q0s: model.states.filter(function (s) { return s.ini; }).map(function (s) { return s.id; }), F: k === "moore" ? [] : model.states.filter(function (s) { return s.fin; }).map(function (s) { return s.id; }), out: {}, loops: {} };
      model.states.forEach(function (s) { sp.out[s.id] = s.out || "?"; sp.loops[s.id] = s.y < 70 ? "down" : "up"; });
      sp.edges = order.map(function (kk) { var e = edges[kk]; var sep = (k === "ap" || k === "mt") ? "\n" : ", "; return { f: e.f, t: e.t, l: e.l.join(sep).replace(/\s*;\s*/g, "\n") }; });

    }
    function render() {
      var sp = spec(), cur = []; if (sel) cur.push(sel); if (from) cur.push(from);
      cv.innerHTML = model.states.length ? SSL.util.drawFA(sp, { cur: cur }) : '<svg viewBox="0 0 640 360" width="640"><text class="fa-sub" x="320" y="180" style="font-size:14px">Tocá acá para crear el primer estado</text></svg>';
      var svg = $("svg", cv); svg.setAttribute("width", "640"); svg.style.width = "100%";
      var opts = model.states.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.id) + "</option>"; }).join("");
      var vf = $("#tf", el).value, vt = $("#tt", el).value;
      $("#tf", el).innerHTML = opts; $("#tt", el).innerHTML = opts;
      if (vf) $("#tf", el).value = vf; if (vt) $("#tt", el).value = vt;
      $("#tlist", el).innerHTML = model.trans.length ? '<table class="t mono tight"><thead><tr><th>De</th><th>A</th><th>Rótulo</th><th></th></tr></thead><tbody>' + model.trans.map(function (t, i) { return "<tr><td>" + esc(t.f) + "</td><td>" + esc(t.t) + '</td><td><input class="txt mono" data-ti="' + i + '" value="' + esc(t.l) + '" style="width:100%;min-width:120px;padding:3px 6px"></td><td><button type="button" class="btn ghost" data-td="' + i + '" aria-label="Borrar transición">✕</button></td></tr>'; }).join("") + "</tbody></table>" : '<p class="empty">Todavía no hay transiciones.</p>';
